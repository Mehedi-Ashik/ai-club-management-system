{% extends "base.html" %}
{% block title %}Create Event — Club Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm border-0">

      <div class="card-header text-white py-3"
           style="background-color: #1565C0;">
        <h4 class="mb-0">Create New Event</h4>
      </div>

      <div class="card-body p-4">
        <form method="post" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">Event Title</label>
            <input type="text" name="title"
                   class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description"
                      class="form-control" rows="4"></textarea>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Category</label>
              <select name="category" class="form-select">
                <option value="workshop">Workshop</option>
                <option value="seminar">Seminar</option>
                <option value="cultural">Cultural</option>
                <option value="sports">Sports</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Event Date</label>
              <input type="date" name="event_date"
                     class="form-control" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Venue</label>
              <input type="text" name="venue"
                     class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Capacity</label>
              <input type="number" name="capacity"
                     class="form-control" value="100">
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Fee (৳)</label>
              <input type="number" name="fee"
                     class="form-control" value="0" step="0.01">
            </div>
            <div class="col-md-6 mb-3 d-flex align-items-end">
              <div class="form-check">
                <input type="checkbox" name="is_public"
                       class="form-check-input" id="is_public" checked>
                <label class="form-check-label fw-semibold"
                       for="is_public">
                  Public Event
                </label>
              </div>
            </div>
          </div>

          <button type="submit"
                  class="btn btn-primary w-100 py-2 fw-semibold">
            Create Event
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
